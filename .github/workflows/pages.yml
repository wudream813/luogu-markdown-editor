name: Pages

on:
  push:
    branches: [main]
  # Allow deploying by hand from the Actions tab.
  workflow_dispatch:

# Allow the deploy job to mint an id-token for Pages, but nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the standalone editor
        run: node build-standalone.js

      # The site is served from index.html + src/ + assets/ rather than from the
      # single-file build. Both work, but the split version is what people actually
      # wait on: it only pulls the KaTeX fonts the page really uses, so first load
      # transfers ~0.7 MB instead of ~2.0 MB. Measured over a throttled 1.5 Mbps
      # link that is 4.4 s to usable versus 5.6 s.
      #
      # The single file is still published alongside it, because it is the thing
      # people download to use offline.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r index.html src assets site/
          cp LuoguMarkdownEditor.html site/
          # Jekyll would otherwise ignore files/dirs beginning with an underscore.
          touch site/.nojekyll
          echo "Site is $(du -sh site | cut -f1)"

      - name: Verify the deployed shell resolves its assets
        run: |
          # A missing vendored file turns the live site into an unstyled page that
          # renders no maths at all, and nothing else in CI would catch it: the
          # standalone build inlines everything, so it stays green either way.
          missing=0
          for ref in $(grep -oE '(src|href)="(src|assets)/[^"]*"' site/index.html \
                       | sed -E 's/.*"(.*)"/\1/'); do
            if [ ! -f "site/$ref" ]; then
              echo "::error::index.html references $ref, which is not in the published site."
              missing=1
            fi
          done
          [ "$missing" = "0" ] && echo "All local references resolve."
          exit $missing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
